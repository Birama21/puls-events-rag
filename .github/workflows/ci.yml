name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installation de uv
        uses: astral-sh/setup-uv@v5

      - name: Installation des dépendances
        run: uv sync

      - name: Exécution des tests avec couverture
        run: uv run python -m pytest --cov=src --cov=api --cov-report=term-missing